# Configuration for the data processing pipeline
data_source:
  kaggle_dataset: "Cornell-University/arxiv"

processing:
  keywords:
    - "consciousness"
    - "sentience"
    - "awareness"
    - "self-awareness"
    - "mind"
    - "experience"

# Paths for the Kaggle pipeline
paths:
  download_dir: "data/01_raw/kaggle_arxiv" 
  output_path: "data/02_intermediate/filtered_papers.csv"

# Configuration for processing the local JSON snapshot
local_json_processing:
  input_path: "data/01_raw/arxiv-metadata-oai-snapshot.json"
  output_path: "data/02_intermediate/filtered_arxiv_metadata.parquet"
  
  filter_keywords:
    - "consciousness"
    - "sentience"
    - "self-awareness"
    - "subjective experience"
    - "qualia"
      
  target_categories:
    - "cs.AI"
    - "phil.CO"
    - "q-bio.NC"
    - "cs.LG"
    - "cs.CL"

  max_title_len: 300
  max_abstract_len: 1000

# Configuration for the vector store creation pipeline
embedding_pipeline:
  # Paths to specific source text files
  transcript_sources:
    - "data/01_raw/anirban_bandopadhyay.txt"
    - "data/01_raw/bernardo_kastrup.txt"
    - "data/01_raw/david_chalmers.txt"
    - "data/01_raw/sir_roger_penrose.txt"
    - "data/01_raw/stuart_hameroff.txt"
  
  # Path to the processed parquet file
  parquet_source: "data/02_intermediate/filtered_arxiv_metadata.parquet"
  
  # Path to save the final FAISS index
  faiss_index_path: "data/06_models/faiss_index"

  # Model and text splitting parameters
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

  # A paper is stored as "Title: ...\n\nAbstract: ..." and abstracts are capped
  # at max_abstract_len (1000) characters, so 1500 keeps each paper whole.
  #
  # This matters more than it looks. The splitter breaks on paragraph boundaries
  # first, then merges neighbours up to chunk_size. At 500 a title could never
  # merge with its own abstract, so every paper produced a stranded title-only
  # chunk: 24% of the index carried no information, and because those chunks are
  # short they matched title-shaped queries strongly and crowded out real
  # content. Keeping a paper in one chunk removes the failure entirely.
  #
  # Transcripts are far longer and still split; the overlap scales with the
  # chunk so a claim near a boundary still appears in both neighbours.
  text_splitter:
    chunk_size: 1500
    chunk_overlap: 150

# Configuration for the RAG chatbot application
rag_application:
  # Use paths from our standardized project structure
  faiss_index_path: "data/06_models/faiss_index"
  log_path: "chatbot.log" # Log file will be in the project root

  # Models
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

  # How to execute the embedding model. "onnx" and "torch" run the same weights
  # and produce identical vectors, so either can read the same FAISS index;
  # "onnx" avoids a ~700MB PyTorch dependency in the container. Override with
  # EMBEDDING_BACKEND.
  embedding_backend: "onnx"

  # The language model is a swappable component. "ollama" runs entirely on this
  # machine with no API key; "gemini" calls a hosted model and needs almost no
  # memory, which is what makes free-tier container hosting practical.
  # Override at runtime with LLM_PROVIDER without editing this file.
  llm:
    provider: "ollama"
    ollama:
      model_name: "qwen2.5:0.5b-instruct"
      base_url: "http://localhost:11434"
    gemini:
      # Alias that tracks the current Flash model. Prefer it over a pinned
      # version like "gemini-2.0-flash": pinned names are quota-limited or
      # unavailable on some API keys, while the alias resolves to whichever
      # Flash model the key can actually reach.
      model_name: "gemini-flash-latest"

  # Retrieval and guardrail parameters
  retrieval_k: 4

  # Maximum FAISS L2 distance for a query to count as "in scope".
  #
  # Tuned by `python -m src.evaluation`, which sweeps this value over a labelled
  # set of 56 cases. 1.02-1.05 is a plateau at F1 0.939 with no false positives;
  # 1.05 is the last value before precision starts falling, so it takes the most
  # recall available at zero cost to precision.
  #
  # This value is tied to the chunking. Larger chunks are semantically broader,
  # so every distance grew when chunk_size went from 500 to 1500 and the old
  # 0.95 became too strict. Any change to chunk size, the corpus, or the
  # embedding model invalidates it - re-run the evaluation.
  #
  # Run-to-run variation of roughly +/-0.04 F1 comes from follow-up condensation,
  # which is a language-model call and is not deterministic on a small model.
  relevance_threshold: 1.05

  # Number of prior conversation turns folded into the prompt.
  history_window: 3

  # Shown verbatim when the relevance gate rejects a query, so the app never
  # invents an answer for something the knowledge base does not cover.
  out_of_scope_message: >
    That question falls outside the scope of this knowledge base. I can only
    answer using the consciousness research papers and expert transcripts I was
    built from - topics like the hard problem of consciousness, qualia,
    sentience, self-awareness, and theories of mind. Try rephrasing your
    question around one of those.

  # RAG Chain parameters
  prompt_template: >
    Use the following pieces of context to answer the user's question.
    If you don't know the answer, or if the question is not related to
    AI consciousness or consciousness, just say that you don't know or
    that the question is outside the scope of this knowledge base.
    Do not try to make up an answer.

    Conversation so far (for context, may be empty):
    {chat_history}

    Context:
    {context}

    Question: {question}

    Answer:

  # Rewrites context-dependent follow-ups ("why?", "tell me more") into
  # standalone questions so retrieval and the relevance gate can score them.
  condense_prompt_template: >
    Given the conversation below, rewrite the follow-up question as a single
    standalone question. Resolve pronouns and references using the conversation.
    If the follow-up already makes sense on its own, repeat it unchanged.
    Output ONLY the rewritten question, nothing else.

    Conversation:
    {chat_history}

    Follow-up question: {question}

    Standalone question:

  # Token budget for the condensation rewrite (short by design).
  condense_num_predict: 40

  # Small models imitate the transcript format in the prompt and keep writing
  # invented "User:/Assistant:" turns after their answer. These cut generation
  # at the first sign of a fabricated turn.
  stop_sequences:
    - "\nUser:"
    - "\nAssistant:"
    - "\nResponse:"
    - "\nQuestion:"
    - "\nContext:"

  # User preference mapping
  answer_length_map:
    short: 100
    medium: 250
    long: 500