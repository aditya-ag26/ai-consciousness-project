# Shared response headers, mirroring what the API sets.
#
# nginx replaces (rather than merges) inherited add_header directives as soon as
# a location defines one of its own, so every location that sets a header must
# pull these in explicitly.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
